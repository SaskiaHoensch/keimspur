<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d181b">
<title>Keimspur Station 4B</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Silkscreen&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#0d181b;      /* Nachtflur */
  --surface:#132327;     /* Aktenmappe */
  --surface2:#1a2f34;
  --line:#2b444a;
  --ink:#e4ede7;         /* Kasack-Weiß mit Grünstich */
  --muted:#97aea8;
  --dispenser:#6ec6e6;   /* Spender-Blau: alles, was man anklicken kann */
  --isolation:#f2c84b;   /* Isolations-Gelb: Nummern, Belege, Sperren */
  --uv:#a6f4ff;          /* Schwarzlicht-Spur */
  --paper:#e9efe6;
  --paper-ink:#1c2a2d;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --pixel:"Silkscreen","IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;background:var(--surface2);border:1px solid var(--line);border-radius:3px;padding:9px 13px;transition:background .15s,border-color .15s}
button:hover:not(:disabled){background:#22404a;border-color:#4d7680}
button:disabled{cursor:not-allowed;opacity:.45}
button.primary{background:var(--dispenser);border-color:var(--dispenser);color:#08222c;font-weight:700}
button.primary:hover:not(:disabled){background:#8fd6ef}
a{color:var(--dispenser);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--isolation);outline-offset:3px}
h1,h2,h3,p{margin:0}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--isolation);font-weight:500}
.muted{color:var(--muted)}
.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:8px;z-index:20;background:var(--ground);padding:8px}

.wrap{max-width:1320px;margin:0 auto;padding-inline:clamp(16px,3vw,32px)}

/* Kopf */
.top{border-bottom:1px solid var(--line);background:#0b1517}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left}
.brand:hover{background:none!important}
.doorsign{display:grid;place-items:center;width:46px;height:46px;background:var(--paper);color:var(--paper-ink);font-family:var(--display);font-weight:700;font-size:1.5rem;border-radius:2px;box-shadow:3px 3px 0 #000}
.brand b{display:block;font-family:var(--display);font-weight:700;font-size:1.45rem;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand small{display:block;color:var(--muted);font-size:.82rem;margin-top:3px}
.tools{display:flex;gap:8px;flex-wrap:wrap}

/* Auftragsleiste */
.mission{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-block:22px 16px}
.mission h1{font-family:var(--display);font-weight:600;font-size:clamp(1.9rem,3.6vw,2.8rem);line-height:1.02;letter-spacing:.005em;text-wrap:balance;margin-top:4px}
.spur{min-width:220px;flex:0 1 300px}
.spur .count{font-family:var(--mono);font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.spur .count strong{color:var(--ink);font-variant-numeric:tabular-nums}
.meter{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:8px}
.meter i{height:10px;background:var(--surface2);border:1px solid var(--line)}
.meter i.on{background:var(--uv);border-color:var(--uv);box-shadow:0 0 8px rgba(166,244,255,.55)}
.meter i.gate{border-right:2px solid var(--isolation)}

/* Spielfläche */
.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.95fr);gap:22px;align-items:start;padding-bottom:28px}
@media (max-width:960px){.layout{grid-template-columns:1fr}}
.map{position:relative;border:1px solid var(--line);background:#081113;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.map canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
.map-bar{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);background:#0b1517}
.map-bar .uvlabel{color:var(--uv)}
.canvaswrap{position:relative}
.hotspots{position:absolute;inset:0}
.hotspot{position:absolute;transform:translate(-50%,-50%);font-family:var(--pixel);font-size:clamp(.58rem,1.15vw,.78rem);letter-spacing:.02em;padding:6px 9px;background:rgba(9,20,23,.88);border:1px solid #5d8088;color:var(--ink);white-space:nowrap;box-shadow:2px 2px 0 #000}
.hotspot:hover:not(:disabled){background:#0f2a31}
.hotspot.active{background:var(--dispenser);color:#08222c;border-color:var(--dispenser)}
.hotspot.locked{border-color:var(--isolation);color:var(--isolation)}
.hotspot .n{opacity:.7;margin-right:4px}

.roombar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:18px}
.roombar h2{font-family:var(--display);font-weight:600;font-size:1.6rem;line-height:1.05}
.badge{font-family:var(--mono);font-size:.78rem;border:1px solid var(--line);padding:4px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.roomdesc{margin-top:6px;max-width:62ch;color:var(--muted)}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:14px}
.case-choice{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:11px 12px;min-height:92px}
.case-choice .num{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;color:var(--isolation)}
.case-choice strong{font-weight:700;line-height:1.25}
.case-choice small{color:var(--muted);line-height:1.3}
.case-choice.selected{border-color:var(--dispenser);background:#12323b;box-shadow:inset 3px 0 0 var(--dispenser)}
.fieldnote{margin-top:14px;font-family:var(--mono);font-size:.82rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}

/* Fallakte */
.file{position:sticky;top:14px;background:var(--surface);border:1px solid var(--line)}
@media (max-width:960px){.file{position:static}}
.file-head{padding:18px 20px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#17292e,#132327)}
.file-head h2{font-family:var(--display);font-weight:600;font-size:1.9rem;line-height:1.05;margin-top:6px;text-wrap:balance}
.person{display:flex;align-items:center;gap:10px;margin-top:12px}
.token{display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--isolation);color:var(--isolation);font-family:var(--mono);font-size:.8rem;font-weight:500}
.person strong{display:block;line-height:1.2}
.person span{color:var(--muted);font-size:.9rem}
.file-body{padding:16px 20px 20px;display:grid;gap:14px}
.question{font-size:1.02rem;border-left:3px solid var(--isolation);padding-left:12px}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.steps button{text-align:left;font-size:.92rem;line-height:1.25;display:flex;gap:8px;align-items:center}
.steps button::before{content:"";flex:none;width:9px;height:9px;border:1px solid #6a8e96}
.steps button.done::before{background:var(--uv);border-color:var(--uv)}
.steps button.active{border-color:var(--dispenser);background:#12323b}
.dialogue{min-height:150px;background:#0e1c20;border:1px solid var(--line);padding:14px 15px}
.dialogue .speaker{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dispenser);margin-bottom:8px}
.dialogue p{max-width:62ch}
.dialogue.document{background:var(--paper);color:var(--paper-ink);border-color:#c9d4c8;position:relative}
.dialogue.document .speaker{color:#7a5a00}
.dialogue.document p{font-family:var(--mono);font-size:.88rem;line-height:1.6}
.dialogue.document::after{content:"GESICHERT";position:absolute;right:12px;top:10px;font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;color:#8a6a0a;border:1.5px solid #b08a1c;padding:2px 6px;transform:rotate(4deg)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
details.help{border-top:1px dashed var(--line);padding-top:10px}
details.help summary{cursor:pointer;color:var(--dispenser)}
details.help p{margin-top:8px;color:var(--muted)}
.foot{font-family:var(--mono);font-size:.78rem;color:var(--muted)}

.pagefoot{border-top:1px solid var(--line)}
.pagefoot .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px;color:var(--muted);font-size:.88rem}
.pagefoot .tools{gap:8px}

/* Dialogfenster */
dialog{width:min(900px,calc(100% - 24px));max-height:88vh;padding:0;background:var(--surface);color:var(--ink);border:1px solid #3d5c63;box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(3,8,10,.72)}
.modal-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;background:#0f1e22;border-bottom:1px solid var(--line)}
.modal-head h2{font-family:var(--display);font-weight:600;font-size:1.6rem;line-height:1.1}
.modal-body{padding:18px 20px 24px;display:grid;gap:14px}
.modal-body p,.modal-body li{max-width:68ch}
.modal-body ol{margin:0;padding-left:1.3em;display:grid;gap:8px}
.notice{background:#0e1c20;border:1px solid var(--line);border-left:3px solid var(--isolation);padding:12px 14px}
.notice strong{display:block;margin-bottom:4px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* Hygieneplan */
.plan{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:720px){.plan{grid-template-columns:1fr}}
.plan-index{position:sticky;top:64px;display:grid;gap:5px}
@media (max-width:720px){.plan-index{position:static;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.plan-index button{text-align:left;font-size:.82rem;padding:7px 9px;line-height:1.25}
.plan-index button b{font-family:var(--mono);color:var(--isolation);font-weight:500;margin-right:6px}
.plan-cards{display:grid;gap:14px}
.rule-card{border:1px solid var(--line);background:#10201f;padding:16px 18px;scroll-margin-top:70px}
.rule-card h3{font-family:var(--display);font-weight:600;font-size:1.35rem;line-height:1.1;display:flex;gap:10px;align-items:baseline}
.rule-card h3 span{font-family:var(--mono);font-size:.8rem;color:var(--isolation);font-weight:500}
.rule-card .rule{margin-top:10px;display:grid;gap:6px}
.rule-card .rule p{padding-left:12px;border-left:2px solid var(--dispenser)}
.rule-card .why,.rule-card .phys{margin-top:10px;color:var(--muted);font-size:.95rem}
.rule-card .why b,.rule-card .phys b{color:var(--ink)}
.rule-card .src{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:.82rem;color:var(--muted);display:grid;gap:4px}

/* Notizbuch */
.note-card{border:1px solid var(--line);padding:14px 16px;display:grid;gap:8px;background:#10201f}
.note-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.note-top h3{font-family:var(--display);font-weight:600;font-size:1.25rem}
label{font-size:.9rem;color:var(--muted)}
select,textarea{width:100%;background:#0b1719;border:1px solid var(--line);border-radius:3px;padding:8px 10px}
textarea{min-height:92px;resize:vertical}
.check{display:flex;gap:8px;align-items:center;color:var(--ink)}
.check input{width:18px;height:18px;accent-color:var(--dispenser)}
.report-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.report-list div{border:1px solid var(--line);padding:8px 10px;font-size:.9rem}
.report-list small{display:block;color:var(--muted)}
.stamp{display:inline-block;font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;color:var(--isolation);border:1.5px solid var(--isolation);padding:3px 8px}

.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,140%);max-width:calc(100% - 32px);background:var(--paper);color:var(--paper-ink);padding:11px 16px;border-radius:3px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .25s;z-index:30}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

#print-area{display:none}
@media print{
  body{background:#fff;color:#000}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block;font-family:Arial,sans-serif;font-size:10.5pt;color:#000}
  #print-area h1{font-size:16pt;margin:0 0 4pt}
  #print-area .meta{margin:0 0 8pt}
  #print-area .pc{border:1px solid #444;padding:6pt 8pt;margin:0 0 6pt;break-inside:avoid}
  #print-area .pc h3{font-size:10.5pt;margin:0 0 4pt}
  #print-area .ln{border-bottom:1px solid #777;height:15pt}
  @page{margin:14mm}
}

</style>
</head>
<body>
<a class="skip" href="#case-panel">Zur aktuellen Fallakte springen</a>
<header class="top"><div class="wrap">
 <button class="brand" id="home" aria-label="Zum Personalbereich"><span class="doorsign">4B</span><span><b>Keimspur</b><small>Ermittlungsakte Hygiene · Kreisklinik Mühlenbach</small></span></button>
 <nav class="tools" aria-label="Ermittlungswerkzeuge"><button id="mission-btn">Auftrag</button><button id="plan-btn">Hygieneplan</button><button id="notes-btn">Notizbuch</button><button id="report-btn" class="primary">Bericht</button></nav>
</div></header>
<main class="wrap">
 <section class="mission">
  <div><span class="eyebrow">Operation Keimspur · Physiotherapie im Praktikum</span><h1>Zehn Beobachtungen. Nicht jede ist ein Fehler.</h1></div>
  <div class="spur" aria-label="Gesicherte Belege"><div class="count"><span>Gesicherte Belege</span><strong id="count">0 / 10</strong></div><div class="meter" id="meter"></div></div>
 </section>
 <div class="layout">
  <section aria-label="Station erkunden">
   <div class="map">
    <div class="map-bar"><span>Grundriss Station 4B</span><span class="uvlabel" id="iso-label">Isolierbereich</span></div>
    <div class="canvaswrap"><canvas id="plan-canvas" width="320" height="200" role="img" aria-label="Pixel-Grundriss der Station 4B: Personalbereich oben links, Patientenzimmer oben rechts, Therapieraum unten links, Isolierbereich unten rechts. Leuchtende Punkte markieren noch nicht gesicherte Belege."></canvas><div class="hotspots" id="hotspots"></div></div>
   </div>
   <div class="roombar"><div><span class="eyebrow" id="room-tag"></span><h2 id="room-title"></h2></div><span class="badge" id="room-progress"></span></div>
   <p class="roomdesc" id="room-desc"></p>
   <div class="cases" id="case-list" aria-label="Fälle in diesem Bereich"></div>
   <p class="fieldnote" id="field-note" role="status"></p>
  </section>
  <aside class="file" id="case-panel" tabindex="-1" aria-label="Aktuelle Fallakte"></aside>
 </div>
</main>
<footer class="pagefoot"><div class="wrap"><span id="save-status">Fortschritt und Notizen bleiben nur in diesem Browser auf diesem Gerät.</span><div class="tools"><button id="print-btn">Berichtsblatt drucken</button><button id="reset-btn">Neu beginnen</button></div></div></footer>
<dialog id="modal" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title"></h2><button id="close-modal" aria-label="Fenster schließen">✕</button></div><div class="modal-body" id="modal-body"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="print-area"></div>

<script>
'use strict';
/* Keimspur · Station 4B
   Inhalte des Spiels. Bewertungen stehen nicht in dieser Datei. */

const GEPRUEFT = '10.09.2026';

const ROOMS = [
 {id:'personal', tag:'01', name:'Personalbereich', short:'Personal', x:19, y:41,
  description:'Umkleide, Spinde, Therapiebüro mit Waschbecken. Hier beginnt jeder Dienst und hier fallen Dinge auf, die man an sich selbst gern übersieht.'},
 {id:'zimmer', tag:'02', name:'Patientenzimmer 4.12 und 4.14', short:'Zimmer 4.12 / 4.14', x:70, y:41,
  description:'Zwei Zweibettzimmer der Unfallchirurgie. Mobilisation, manuelle Therapie, Gehtraining: direkt am Bett und mitten in der Patientenumgebung.'},
 {id:'therapie', tag:'03', name:'Therapieraum 2', short:'Therapieraum', x:24, y:62,
  description:'Liegen, Barren, Kleingeräte. Viele Patient:innen nacheinander auf denselben Flächen.'},
 {id:'isolier', tag:'04', name:'Isolierbereich 4.20 und 4.22', short:'Isolierbereich', x:80, y:62,
  description:'Zwei Einzelzimmer mit Schleuse. Hier gelten zusätzliche Regeln, die über die Basishygiene hinausgehen.'}
];

const PEOPLE = {
 jonas:{name:'Jonas Brehm', role:'Physiotherapeut', token:'JB'},
 lea:{name:'Lea Hartmann', role:'Physiotherapeutin', token:'LH'},
 mira:{name:'Mira Yıldız', role:'Physiotherapeutin', token:'MY'},
 samir:{name:'Samir Haddad', role:'Physiotherapeut', token:'SH'},
 nele:{name:'Nele Brandt', role:'Physiotherapeutin', token:'NB'}
};

const CASES = [
 {id:1, room:'personal', who:'jonas', mx:40, my:52, title:'Der glatte Ring', focus:'Schmuck an Händen und Unterarmen',
  witnessName:'Mira Yıldız', witnessRole:'Physiotherapeutin, Kollegin',
  statement:'Ich trage nur meinen Ehering und eine Smartwatch. Der Ring ist ganz glatt, da sammelt sich nichts. Die Uhr brauche ich, um bei den Übungen die Zeit zu stoppen.',
  witness:'Vorhin hat Jonas Frau Kühn aus dem Bett an die Bettkante mobilisiert. Ring und Uhr hatte er dabei an. Ich habe ihn schon mal darauf angesprochen, aber er meint, das sei übertrieben.',
  evidenceTitle:'B01 · Beobachtungsprotokoll Hygienerundgang',
  evidence:'07:40 Uhr, Zimmer 4.14. J. Brehm mobilisiert eine Patientin an die Bettkante, direkter Hautkontakt an Unterarm und Rücken. Händedesinfektion vor und nach dem Kontakt durchgeführt. Getragen: glatter Ehering links, Smartwatch mit Silikonarmband am linken Handgelenk. Fingernägel kurz und unlackiert.',
  confront:'Ich desinfiziere doch jedes Mal. Den Ring drehe ich dabei extra hin und her, damit das Mittel darunter kommt. Das muss reichen.',
  hint:'Prüfen Sie, ob die Regel zwischen glattem und verziertem Schmuck unterscheidet. Achten Sie auch darauf, bei welchen Tätigkeiten sie gilt.'},

 {id:2, room:'personal', who:'lea', mx:84, my:30, title:'Schnupfen im Dienst', focus:'eigener Atemwegsinfekt',
  witnessName:'Tim Wolter', witnessRole:'Auszubildender Pflege',
  statement:'Ich habe seit gestern Schnupfen, aber kein Fieber und fühle mich fit. Deshalb arbeite ich und trage bei allen Behandlungen einen Mund-Nasen-Schutz.',
  witness:'Mit einer Erkältung gehört man nach Hause. Die steckt doch die Patienten an! Ich finde, sie hätte sich krankmelden müssen.',
  evidenceTitle:'B02 · Dienstnotiz der Therapieleitung',
  evidence:'07:00 Uhr. L. Hartmann meldet Schnupfen seit gestern, kein Fieber, kein Krankheitsgefühl. Nach Rücksprache mit der Leitung arbeits- und einsatzfähig. Vereinbart: medizinischer Mund-Nasen-Schutz bei allen Patientenkontakten, Wechsel bei Durchfeuchtung, Händedesinfektion nach dem Naseputzen. Beobachtung 08:30 bis 12:00 Uhr: Vereinbarung durchgehend eingehalten.',
  confront:'Hätte ich Fieber oder würde ich mich krank fühlen, wäre ich zu Hause geblieben. So habe ich mich mit der Leitung abgesprochen und halte mich daran.',
  hint:'Unterscheiden Sie zwischen „arbeitsfähig mit leichtem Infekt“ und „krank“. Was sieht der Hygieneplan für Beschäftigte mit Schnupfen vor?'},

 {id:3, room:'personal', who:'mira', mx:108, my:24, title:'Waschen oder desinfizieren?', focus:'Händewaschen zwischen zwei Patientenkontakten',
  witnessName:'Gerd Kowalski', witnessRole:'Patient, Zimmer 4.14',
  statement:'Zwischen zwei Patienten desinfiziere ich meine Hände. Ans Waschbecken gehe ich nur, wenn meine Hände sichtbar schmutzig sind oder ich auf der Toilette war.',
  witness:'Die junge Frau wäscht sich nie die Hände. Die reibt nur dieses Zeug aus der Flasche drauf. Früher hat man sich im Krankenhaus noch richtig mit Seife gewaschen.',
  evidenceTitle:'B03 · Beobachtungsprotokoll Hygienerundgang',
  evidence:'09:15 bis 09:50 Uhr, Zimmer 4.14 und Therapiebüro. M. Yıldız behandelt nacheinander zwei Patienten. Vor und nach jedem Patientenkontakt hygienische Händedesinfektion, etwa 3 ml, Einreibezeit etwa 30 Sekunden. Hände vorher trocken und sichtbar sauber. Kein Kontakt mit Körperflüssigkeiten. Keine Händewaschung.',
  confront:'Wenn ich mir bei zwanzig Patienten am Tag jedes Mal die Hände wasche, ist meine Haut nach einer Woche kaputt. Und gegen die Keime hilft das Desinfektionsmittel sowieso besser.',
  hint:'Suchen Sie im Hygieneplan, wofür das Händewaschen gedacht ist und was zwischen zwei Patientenkontakten vorgesehen ist.'},

 {id:4, room:'zimmer', who:'jonas', mx:176, my:70, title:'Der Beutel am Ständer', focus:'Mobilisation mit Blasenkatheter',

/* ---------- Oberfläche ---------- */
function render(){
 const n=evidenceCount();
 $('#count').textContent=`${n} / 10`;
 $('#meter').innerHTML=CASES.map((c,i)=>`<i class="${i<n?'on':''} ${i===GATE-1?'gate':''}"></i>`).join('');
 $('#iso-label').textContent=isoOpen()?'Isolierbereich: eingewiesen':`Isolierbereich: Einweisung ab ${GATE} Belegen`;
 $('#hotspots').innerHTML=ROOMS.map(r=>{const locked=r.id==='isolier'&&!isoOpen();return `<button class="hotspot ${state.room===r.id?'active':''} ${locked?'locked':''}" style="left:${r.x}%;top:${r.y}%" data-room="${r.id}" aria-pressed="${state.room===r.id}"><span class="n">${locked?'▣':r.tag}</span>${esc(r.short)}</button>`;}).join('');
 const room=ROOMS.find(r=>r.id===state.room),list=CASES.filter(c=>c.room===room.id);
 $('#room-tag').textContent=`Bereich ${room.tag}`;$('#room-title').textContent=room.name;$('#room-desc').textContent=room.description;
 $('#room-progress').textContent=`${list.filter(c=>seen(c.id,'evidence')).length} / ${list.length} Belege`;
 $('#case-list').innerHTML=list.map(c=>`<button class="case-choice ${state.caseId===c.id?'selected':''}" data-case="${c.id}" aria-pressed="${state.caseId===c.id}"><span class="num">FALL ${pad(c.id)}${seen(c.id,'evidence')?' · BELEG ✓':''}</span><strong>${esc(c.title)}</strong><small>${esc(who(c).name)}</small></button>`).join('');
 $('#field-note').textContent=n===10?'Alle zehn Belege sind gesichert. Prüfen Sie Ihre Notizen und schreiben Sie den Bericht.':isoOpen()?'Sie sind eingewiesen. Auch im Isolierbereich warten zwei Beobachtungen.':`Noch ${GATE-n} ${GATE-n===1?'Beleg':'Belege'} bis zur Einweisung in den Isolierbereich.`;
 renderCase();
 if(reduce)drawPlan(null);
}
function renderCase(){
 const c=CASES.find(x=>x.id===state.caseId),p=who(c);
 const steps=[['person',`${p.name} befragen`],['witness',`${c.witnessName} befragen`],['evidence','Beleg sichern'],['confront','Beleg vorlegen']];
 const ready=seen(c.id,'person')&&seen(c.id,'witness');
 let body=`<div class="speaker">Ihr nächster Schritt</div><p>Hören Sie zuerst ${esc(p.name)} und ${esc(c.witnessName)}. Sichern Sie dann den Beleg und legen Sie ihn vor. Die Bewertung treffen Sie mit dem Hygieneplan.</p>`,doc=false;
 if(activeStep==='person')body=`<div class="speaker">${esc(p.name)} · Aussage</div><p>„${esc(c.statement)}“</p>`;
 if(activeStep==='witness')body=`<div class="speaker">${esc(c.witnessName)} · ${esc(c.witnessRole)}</div><p>„${esc(c.witness)}“</p>`;
 if(activeStep==='evidence'){doc=true;body=`<div class="speaker">${esc(c.evidenceTitle)}</div><p>${esc(c.evidence)}</p>`;}
 if(activeStep==='confront')body=`<div class="speaker">${esc(p.name)} · Nachfrage mit Beleg</div><p>„${esc(c.confront)}“</p>`;
 $('#case-panel').innerHTML=`<div class="file-head"><span class="eyebrow">Fallakte ${pad(c.id)} / 10</span><h2>${esc(c.title)}</h2><div class="person"><span class="token" aria-hidden="true">${p.token}</span><span><strong>${esc(p.name)}</strong><span>${esc(p.role)}</span></span></div></div>
 <div class="file-body"><p class="question">Prüffrage: Liegt beim Thema „${esc(c.focus)}“ ein Hygienefehler vor?</p>
 <div class="steps">${steps.map(([k,l])=>`<button data-step="${k}" class="${seen(c.id,k)?'done':''} ${activeStep===k?'active':''}" ${(k==='evidence'&&!ready)||(k==='confront'&&!seen(c.id,'evidence'))?'disabled':''} aria-pressed="${activeStep===k}">${esc(l)}</button>`).join('')}</div>
 <div class="dialogue ${doc?'document':''}" aria-live="polite">${body}</div>
 <div class="actions"><button data-action="plan">Hygieneplan öffnen</button><button data-action="case-note" class="primary">Notiz zu Fall ${c.id}</button></div>
 <details class="help"><summary>Denkhilfe einblenden</summary><p>${esc(c.hint)}</p></details>
 <p class="foot">${seen(c.id,'evidence')?'Beleg gesichert. ':''}${state.reviewed[c.id]?'Von Ihnen als geprüft markiert.':'Ihr Urteil schreiben Sie selbst auf das Berichtsblatt.'}</p></div>`;
}

function closeModal(){$('#modal').close();}

 <span class="stamp">KREISKLINIK MÜHLENBACH · STATION 4B</span>
 <p>Auf Station 4B sind in den letzten Wochen mehr Infektionen aufgetreten als üblich. Die Hygienefachkraft Karin Adler hat zehn Beobachtungen gesammelt, die ihr gemeldet wurden. Sie bittet Sie als neue Praktikant:innen der Physiotherapie, jede Beobachtung mit frischem Blick zu prüfen.</p>
 <ol>
  <li><strong>Bereich wählen:</strong> Klicken Sie auf dem Grundriss einen Bereich an und öffnen Sie eine Fallakte.</li>
  <li><strong>Beide Seiten hören:</strong> Befragen Sie die beteiligte Person und die Zeugin oder den Zeugen. Erst dann können Sie den Beleg sichern und vorlegen.</li>
  <li><strong>Regeln prüfen:</strong> Vergleichen Sie den Beleg mit dem Hygieneplan der Klinik. Halten Sie Ihre Gedanken im Notizbuch fest.</li>
  <li><strong>Bericht schreiben:</strong> Entscheiden Sie auf dem Berichtsblatt für jeden Fall, ob ein Hygienefehler vorliegt. Begründen Sie mit Beleg und Regel. Liegt ein Fehler vor, beschreiben Sie, wie es richtig wäre.</li>
 </ol>
 <p>Nach ${GATE} gesicherten Belegen weist Frau Adler Sie in den Isolierbereich ein. <strong>Nicht jede verdächtige Situation ist ein Fehler.</strong> Die leuchtenden Punkte auf dem Grundriss zeigen, wo noch Belege liegen.</p>
 <div class="notice"><strong>So werden die Fälle geprüft</strong><p>Alle Personen, Orte und Ereignisse sind erfunden. Geprüft wird nur die Prüffrage des jeweiligen Falls. Was im Fall nicht erwähnt wird, gilt als korrekt. Grundlage ist ausschließlich der Hygieneplan der Kreisklinik Mühlenbach in diesem Spiel. Im Praktikum gilt der Hygieneplan Ihrer Einrichtung.</p></div>
 <p class="muted">Sie können ohne Zeitdruck arbeiten. Vorgesehen sind etwa 55 Minuten Ermittlung und danach der schriftliche Bericht. Ihre Eingaben bleiben nur in diesem Browser auf diesem Gerät. Es wird nichts an Ihre Lehrkraft gesendet.</p>
 <div class="btnrow"><button class="primary" data-action="close">Ermittlung beginnen</button></div>`);}

 <div class="btnrow"><button data-action="all-notes">Meine Notizen</button><button class="primary" data-action="close">Weiter ermitteln</button></div>`);}

function exportNotes(){let t='KEIMSPUR · STATION 4B · ERMITTLUNGSNOTIZEN\n\n';for(const c of CASES){t+=`Fall ${pad(c.id)}: ${c.title} (${c.focus})\nBeleg: ${seen(c.id,'evidence')?c.evidence:'noch nicht gesichert'}\nVorläufiges Urteil: ${state.decisions[c.id]==='ja'?'Hygienefehler':state.decisions[c.id]==='nein'?'kein Hygienefehler':'offen'}\nNotizen: ${state.notes[c.id]||'-'}\n\n`;}
 try{const u=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='Keimspur-Notizen.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);toast('Die Textdatei wird gespeichert. Falls nichts passiert: Notizen drucken.');}catch(e){toast('Speichern ist hier nicht möglich. Bitte Notizen drucken.');}}
function printSheet(withNotes){$('#print-area').innerHTML=`<h1>Keimspur · Station 4B · ${withNotes?'Meine Notizen':'Berichtsblatt'}</h1><p class="meta">Name: ______________________ Klasse: __________ Datum: __________</p>${withNotes?'':'<p class="meta">Prüfen Sie alle zehn Fälle. Kreuzen Sie an, nennen Sie die Regel aus dem Hygieneplan, den entscheidenden Beleg und Ihre Begründung.</p>'}${CASES.map(c=>`<section class="pc"><h3>Fall ${pad(c.id)} · ${esc(c.title)} · ${esc(c.focus)}</h3>${withNotes?`<p>Vorläufiges Urteil: ${state.decisions[c.id]==='ja'?'Hygienefehler':state.decisions[c.id]==='nein'?'kein Hygienefehler':'offen'}</p><p>${esc(state.notes[c.id]||'Keine Notiz')}</p>`:`<p>Hygienefehler? □ ja □ nein &nbsp;&nbsp; Regel: P____</p><p>Entscheidender Beleg:</p><div class="ln"></div><p>Begründung:</p><div class="ln"></div><div class="ln"></div><p>Falls Fehler, richtig wäre:</p><div class="ln"></div>`}</section>`).join('')}`;
 if($('#modal').open)closeModal();setTimeout(()=>window.print(),50);}
function reset(){openModal('Neu beginnen?',`<p>Damit werden Fortschritt und Notizen in diesem Browser gelöscht. Drucken oder speichern Sie Ihre Notizen vorher, wenn Sie sie behalten möchten.</p><div class="btnrow"><button data-action="print-notes">Notizen drucken</button><button data-action="do-reset">Löschen und neu beginnen</button><button class="primary" data-action="close">Abbrechen</button></div>`);}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.room){setRoom(b.dataset.room);return;}
 if(b.dataset.case){setCase(Number(b.dataset.case));return;}
 if(b.dataset.step){const k=b.dataset.step,id=state.caseId;if((k==='evidence'&&!(seen(id,'person')&&seen(id,'witness')))||(k==='confront'&&!seen(id,'evidence')))return;activeStep=k;mark(id,k);render();document.querySelector(`[data-step="${k}"]`)?.focus({preventScroll:true});return;}
 if(b.dataset.plan){document.getElementById('plan-'+b.dataset.plan)?.scrollIntoView({block:'start'});return;}
 if(b.dataset.jump){closeModal();setCase(Number(b.dataset.jump));return;}
 switch(b.dataset.action){
  case 'plan':showPlan();break;case 'case-note':showNotes(state.caseId);break;case 'all-notes':showNotes();break;
  case 'close':closeModal();break;case 'export':exportNotes();break;case 'print-notes':printSheet(true);break;case 'print-blank':printSheet(false);break;
  case 'finish':finish();break;case 'do-reset':state=fresh();activeStep='';save();closeModal();render();showMission();break;}
});
document.addEventListener('input',e=>{if(e.target.dataset.note){state.notes[e.target.dataset.note]=e.target.value;save();}});
document.addEventListener('change',e=>{if(e.target.dataset.decision){state.decisions[e.target.dataset.decision]=e.target.value;save();}if(e.target.dataset.review){state.reviewed[e.target.dataset.review]=e.target.checked;save();renderCase();}});
$('#mission-btn').onclick=showMission;$('#plan-btn').onclick=()=>showPlan();$('#notes-btn').onclick=()=>showNotes();$('#report-btn').onclick=showReport;
$('#close-modal').onclick=closeModal;$('#reset-btn').onclick=reset;$('#print-btn').onclick=()=>printSheet(false);$('#home').onclick=()=>setRoom('personal');
$('#modal').addEventListener('close',()=>{if(returnFocus&&returnFocus.isConnected)returnFocus.focus();});

load();if(state.room==='isolier'&&!isoOpen()){state.room='personal';state.caseId=1;}
render();save();
if(!reduce)requestAnimationFrame(loop);
if(!state.started)showMission();
})();

</script>
</body>
</html>
